<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- Meta viewport sangat penting agar web responsif di HP -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Valas MT4</title>
    <!-- Menggunakan Bootstrap untuk desain instan yang rapi -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-top: 20px; }
        .price-box {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        .bid-ask { font-size: 1.5rem; font-weight: bold; }
        .bid { color: #dc3545; } /* Merah */
        .ask { color: #198754; } /* Hijau */
        .flash { animation: flash-bg 0.5s; }
        
        /* Efek kedip saat harga berubah */
        @keyframes flash-bg {
            0% { background-color: #fff3cd; }
            100% { background-color: transparent; }
        }
    </style>
</head>
<body>

<div class="container">
    <h3 class="text-center mb-4">Monitor Harga MT4</h3>
    
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-4 mb-3">
            <div class="price-box" id="box-eurusd">
                <h4 class="mb-3">EUR/USD</h4>
                <div class="d-flex justify-content-between">
                    <div>
                        <small class="text-muted">BID (Jual)</small>
                        <div class="bid-ask bid" id="bid-eurusd">0.0000</div>
                    </div>
                    <div>
                        <small class="text-muted">ASK (Beli)</small>
                        <div class="bid-ask ask" id="ask-eurusd">0.0000</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Fungsi untuk menarik data dari Python (Flask API)
    function fetchLivePrice(pair) {
        fetch(`/api/harga/${pair}`)
            .then(response => response.json())
            .then(data => {
                if(data.error) {
                    console.error("Error dari MT4:", data.error);
                    return;
                }
                
                // Update angka di HTML
                document.getElementById(`bid-${pair.toLowerCase()}`).innerText = data.bid;
                document.getElementById(`ask-${pair.toLowerCase()}`).innerText = data.ask;
                
                // Beri efek kedip agar terlihat live
                const box = document.getElementById(`box-${pair.toLowerCase()}`);
                box.classList.remove('flash');
                void box.offsetWidth; // Trigger reflow
                box.classList.add('flash');
            })
            .catch(error => console.error('Error fetching data:', error));
    }

    // Jalankan fungsi fetchLivePrice setiap 1000 milidetik (1 detik)
    setInterval(() => {
        fetchLivePrice('EURUSD');
    }, 1000);
    
    // Tarik data pertama kali saat web dibuka
    fetchLivePrice('EURUSD');
</script>

</body>
</html>
