<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Valas: USD/IDR & EUR/USD</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #121212; 
            color: white; 
            padding-top: 30px; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        .price-box { 
            background: #1e1e1e; 
            border-radius: 15px; 
            padding: 25px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.5); 
            text-align: center; 
            border: 1px solid #333;
            transition: all 0.3s ease;
        }
        .bid-ask { font-size: 2.2rem; font-weight: bold; font-family: monospace; }
        .bid { color: #ff4d4d; } /* Merah */
        .ask { color: #00e676; } /* Hijau */
        
        /* Efek Kedip */
        .flash { animation: flash-bg 0.5s; }
        @keyframes flash-bg {
            0% { background-color: #3d3d3d; }
            100% { background-color: transparent; }
        }
    </style>
</head>
<body>

<div class="container">
    <h3 class="text-center mb-4">Monitor Harga Live</h3>
    
    <div class="row justify-content-center">
        <!-- Kotak Harga Rupiah (USDIDR) -->
        <div class="col-12 col-md-6 col-lg-5 mb-4">
            <div class="price-box" id="box-usdidr">
                <h4 class="mb-3" style="color: #ffd700;">USD/IDR (Rupiah)</h4>
                <div class="d-flex justify-content-between">
                    <div>
                        <small class="text-muted d-block mb-1">BID (Jual)</small>
                        <div class="bid-ask bid" id="bid-usdidr">---</div>
                    </div>
                    <div>
                        <small class="text-muted d-block mb-1">ASK (Beli)</small>
                        <div class="bid-ask ask" id="ask-usdidr">---</div>
                    </div>
                </div>
                <div class="mt-2 text-danger small" id="err-usdidr"></div>
            </div>
        </div>

        <!-- Kotak Harga Euro (EURUSD) -->
        <div class="col-12 col-md-6 col-lg-5 mb-4">
            <div class="price-box" id="box-eurusd">
                <h4 class="mb-3" style="color: #4db8ff;">EUR/USD</h4>
                <div class="d-flex justify-content-between">
                    <div>
                        <small class="text-muted d-block mb-1">BID (Jual)</small>
                        <div class="bid-ask bid" id="bid-eurusd">---</div>
                    </div>
                    <div>
                        <small class="text-muted d-block mb-1">ASK (Beli)</small>
                        <div class="bid-ask ask" id="ask-eurusd">---</div>
                    </div>
                </div>
                <div class="mt-2 text-danger small" id="err-eurusd"></div>
            </div>
        </div>
    </div>
</div>

<script>
    function fetchLivePrice(pair) {
        fetch(`/api/harga/${pair}`)
            .then(response => response.json())
            .then(data => {
                // Tangani pesan error dari server
                if(data.error) {
                    document.getElementById(`err-${pair.toLowerCase()}`).innerText = data.error;
                    return;
                }
                
                document.getElementById(`err-${pair.toLowerCase()}`).innerText = "";
                
                let finalBid = data.bid;
                let finalAsk = data.ask;
                
                // Jika pair adalah IDR, gunakan pemisah ribuan
                if(pair === 'USDIDR') {
                    finalBid = new Intl.NumberFormat('id-ID').format(data.bid);
                    finalAsk = new Intl.NumberFormat('id-ID').format(data.ask);
                }

                // Tampilkan angka ke dalam HTML
                document.getElementById(`bid-${pair.toLowerCase()}`).innerText = finalBid;
                document.getElementById(`ask-${pair.toLowerCase()}`).innerText = finalAsk;
                
                // Memicu animasi berkedip
                const box = document.getElementById(`box-${pair.toLowerCase()}`);
                box.classList.remove('flash');
                void box.offsetWidth;
                box.classList.add('flash');
            })
            .catch(error => console.error('Gagal mengambil data:', error));
    }

    // Refresh data secara berkala (3 detik)
    setInterval(() => {
        fetchLivePrice('USDIDR');
        // Beri jeda antar pemanggilan agar tidak ditolak server (rate limit)
        setTimeout(() => fetchLivePrice('EURUSD'), 1500); 
    }, 3000);
    
    // Tarikan data pertama kali halaman dimuat
    fetchLivePrice('USDIDR');
    setTimeout(() => fetchLivePrice('EURUSD'), 1500);
</script>

</body>
</html>
