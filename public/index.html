<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Valas & Gold</title>
    <!-- Framework Bootstrap untuk layout responsif di HP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #121212; 
            color: white; 
            padding-top: 30px; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        .price-box { 
            background: #1e1e1e; 
            border-radius: 15px; 
            padding: 25px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.5); 
            text-align: center; 
            border: 1px solid #333;
            transition: all 0.3s ease;
        }
        .bid-ask { font-size: 2.2rem; font-weight: bold; font-family: monospace; }
        .bid { color: #ff4d4d; } /* Merah Jual */
        .ask { color: #00e676; } /* Hijau Beli */
        
        /* Efek Kedip saat harga update */
        .flash { animation: flash-bg 0.5s; }
        @keyframes flash-bg {
            0% { background-color: #3d3d3d; }
            100% { background-color: transparent; }
        }
    </style>
</head>
<body>

<div class="container">
    <h3 class="text-center mb-4">Monitor Harga Live</h3>
    
    <div class="row justify-content-center">
        <!-- Kotak Harga Emas (XAUUSD) -->
        <div class="col-12 col-md-6 col-lg-5 mb-4">
            <div class="price-box" id="box-xauusd">
                <h4 class="mb-3" style="color: #ffd700;">XAU/USD (Gold)</h4>
                <div class="d-flex justify-content-between">
                    <div>
                        <small class="text-muted d-block mb-1">BID (Jual)</small>
                        <div class="bid-ask bid" id="bid-xauusd">---</div>
                    </div>
                    <div>
                        <small class="text-muted d-block mb-1">ASK (Beli)</small>
                        <div class="bid-ask ask" id="ask-xauusd">---</div>
                    </div>
                </div>
                <div class="mt-2 text-danger small" id="err-xauusd"></div>
            </div>
        </div>

        <!-- Kotak Harga Euro (EURUSD) -->
        <div class="col-12 col-md-6 col-lg-5 mb-4">
            <div class="price-box" id="box-eurusd">
                <h4 class="mb-3" style="color: #4db8ff;">EUR/USD</h4>
                <div class="d-flex justify-content-between">
                    <div>
                        <small class="text-muted d-block mb-1">BID (Jual)</small>
                        <div class="bid-ask bid" id="bid-eurusd">---</div>
                    </div>
                    <div>
                        <small class="text-muted d-block mb-1">ASK (Beli)</small>
                        <div class="bid-ask ask" id="ask-eurusd">---</div>
                    </div>
                </div>
                <div class="mt-2 text-danger small" id="err-eurusd"></div>
            </div>
        </div>
    </div>
</div>

<script>
    function fetchLivePrice(pair) {
        fetch(`/api/harga/${pair}`)
            .then(response => response.json())
            .then(data => {
                // Tangkap error jika ada
                if(data.error) {
                    document.getElementById(`err-${pair.toLowerCase()}`).innerText = data.error;
                    return;
                }
                
                // Bersihkan pesan error jika sukses
                document.getElementById(`err-${pair.toLowerCase()}`).innerText = "";
                
                // Masukkan angka ke HTML
                document.getElementById(`bid-${pair.toLowerCase()}`).innerText = data.bid;
                document.getElementById(`ask-${pair.toLowerCase()}`).innerText = data.ask;
                
                // Efek kedip (flash) menandakan data baru masuk
                const box = document.getElementById(`box-${pair.toLowerCase()}`);
                box.classList.remove('flash');
                void box.offsetWidth; // Trigger DOM Reflow
                box.classList.add('flash');
            })
            .catch(error => console.error('Gagal mengambil data:', error));
    }

    // Refresh harga tiap 3 detik 
    // (Finnhub membatasi 60 request/menit untuk akun gratis)
    setInterval(() => {
        fetchLivePrice('XAUUSD');
        // Jeda 1.5 detik antara XAU dan EUR agar API tidak dibanjiri request bersamaan
        setTimeout(() => fetchLivePrice('EURUSD'), 1500); 
    }, 3000);
    
    // Panggilan pertama saat web baru dibuka
    fetchLivePrice('XAUUSD');
    setTimeout(() => fetchLivePrice('EURUSD'), 1500);
</script>

</body>
</html>
